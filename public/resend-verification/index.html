<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#050505" /><title>Resend email confirmation | Fan Lynks</title><link rel="icon" href="/favicon.ico" /><link rel="stylesheet" href="/customer.css" /></head>
<body data-flow="resend">
  <header class="customer-header"><a class="brand" href="/creators"><img src="/assets/fanlynks/preview-icon.png" alt="" /><span>Fan Lynks</span></a><nav class="header-actions" aria-label="Account"><a href="/login">Sign in</a></nav></header>
  <main class="auth-shell"><section class="auth-copy"><p class="eyebrow">Email confirmation</p><h1>Need another confirmation link?</h1><p>Request another link if your account still needs email confirmation.</p></section>
    <section class="auth-card"><h2>Resend confirmation</h2><p class="muted">For privacy, the response is the same whether or not a matching account needs confirmation.</p><form id="resendForm" data-auth-form><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required /><div id="turnstileWidget" class="security-check" aria-label="Security check"></div><input id="turnstileToken" name="turnstileToken" type="hidden" /><div class="form-actions"><button class="primary" type="submit">Send confirmation link</button></div></form><p id="formStatus" class="form-status" role="status" aria-live="polite"></p></section></main>
  <script type="module" src="/customer-auth.js"></script>
</body>
</html>
