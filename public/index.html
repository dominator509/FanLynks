<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>Fan Lynks</title>
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/fanlynks/apple-touch-icon.png" />
  <style>
    @font-face {
      font-family: "Montserrat";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("/assets/fonts/montserrat-semibold.ttf") format("truetype");
    }
    @font-face {
      font-family: "Montserrat";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("/assets/fonts/montserrat-bold.ttf") format("truetype");
    }
    :root {
        --bg: #050505;
        --bg-accent: radial-gradient(circle at top, rgba(207,160,41,0.16), transparent 34%);
        --surface: #121212;
        --surface-2: #1a1a1a;
        --text: #ffffff;
        --muted: #c8c2b5;
        --accent: #cfa029;
        --primary-bg: #cfa029;
        --primary-text: #050505;
        --secondary-bg: #171717;
        --secondary-text: #ffffff;
        --neutral-bg: #101010;
        --neutral-text: #f5f0e8;
        --border: #302819;
        --icon-bg: #ffffff;
        --shadow: 0 18px 44px rgba(0,0,0,0.24);
        --radius: 14px;
        --button-radius: 12px;
        --font-body: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-heading: "Montserrat", var(--font-body);
        --max-width: 720px;
        --gap: 14px;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: var(--font-body);
        background: var(--bg-accent), var(--bg);
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
        line-height: 1.45;
      }

      .app {
        min-height: 100vh;
        padding: 18px 14px 54px;
      }

      .shell {
        width: 100%;
        max-width: var(--max-width);
        margin: 0 auto;
      }

      .card {
        background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 100%, white 0%), color-mix(in srgb, var(--surface) 78%, transparent));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: var(--radius);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .announcement {
        display: none;
        text-decoration: none;
        color: var(--text);
        padding: 11px 13px;
        margin-bottom: 12px;
        font-size: 0.9rem;
        align-items: center;
        justify-content: space-between;
      }
      .announcement strong { font-weight: 650; }
      .announcement .arrow { opacity: 0.7; }

      .hero {
        padding: 20px 18px;
        margin-bottom: 16px;
      }
      .hero-top {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
      }
      .avatar {
        width: 60px;
        height: 60px;
        border-radius: 10px;
        object-fit: cover;
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--border);
        display: none;
      }
      .avatar.brand-avatar {
        border-color: rgba(207,160,41,0.34);
        border-radius: 12px;
        padding: 7px;
        background: radial-gradient(circle at 50% 0%, rgba(207,160,41,.18),transparent 70%), linear-gradient(160deg,#18140d,#050505);
        box-shadow: 0 8px 24px rgba(0,0,0,.45), 0 0 18px rgba(207,160,41,.1);
      }
      .eyebrow {
        color: var(--accent);
        font-size: 0.76rem;
        letter-spacing: 0;
        text-transform: uppercase;
        font-weight: 650;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0;
        font-family: var(--font-heading);
        font-size: clamp(1.7rem, 4.8vw, 2.35rem);
        line-height: 1.08;
        letter-spacing: 0;
        font-weight: 700;
      }
      .brand-page h1 { font-family: "Montserrat", var(--font-body); }
      .subtitle {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 0.96rem;
        line-height: 1.5;
      }
      .hero-cta {
        display: inline-flex;
        margin-top: 16px;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-family: "Montserrat", var(--font-body);
        font-weight: 700;
        font-size: .93rem;
        letter-spacing: -.01em;
        min-height: 48px;
        padding: 13px 23px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,.12);
        background: linear-gradient(135deg, #f0d27a, #cfa029);
        color: #211704;
        box-shadow: 0 10px 25px rgba(207,160,41,.18), inset 0 1px rgba(255,255,255,.45);
        transition: transform .18s ease, box-shadow .18s ease;
      }

      .hero-cta:hover {
        transform: translateY(-2px);
        filter: brightness(1.06);
        box-shadow: 0 14px 30px rgba(207,160,41,.26);
      }
      .hero-cta:focus-visible, .link-row:focus-visible {
        outline: 2px solid #f0d27a;
        outline-offset: 3px;
      }
      .hero-cta:active { transform: translateY(0); }

      .section-label {
        font-size: 0.76rem;
        letter-spacing: 0;
        text-transform: uppercase;
        color: var(--muted);
        margin: 18px 4px 10px;
        font-weight: 650;
      }

      .links {
        display: grid;
        gap: var(--gap);
      }

      .link-row {
        position: relative;
        display: grid;
        grid-template-columns: 46px minmax(0, 1fr) 46px;
        align-items: center;
        column-gap: 12px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
        padding: 12px;
        border-radius: 16px;
        border: 1px solid rgba(207,160,41,.22);
        background: rgba(255,255,255,.035);
        box-shadow: none;
        transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      }
      .link-row:hover {
        transform: translateY(-1px);
        border-color: rgba(240,210,122,.45);
        box-shadow: 0 10px 24px rgba(0,0,0,.16);
      }
      .link-row.primary {
        border-color: rgba(255,255,255,.12);
        background: linear-gradient(135deg, #f0d27a, #cfa029);
        color: #211704;
        box-shadow: 0 10px 25px rgba(207,160,41,.14), inset 0 1px rgba(255,255,255,.38);
      }
      .link-row.neutral {
        background: rgba(255,255,255,.025);
        color: var(--neutral-text);
      }

      .icon-slot {
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: var(--icon-bg);
        border: 1px solid rgba(255,255,255,0.1);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        overflow: hidden;
        flex-shrink: 0;
      }
      .link-row.primary .icon-slot {
        background: rgba(0,0,0,0.08);
        border-color: rgba(0,0,0,0.05);
        color: rgba(0,0,0,0.64);
      }
      .icon-slot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .icon-emoji {
        font-size: 1.3rem;
        line-height: 1;
      }

      .content {
        min-width: 0;
        text-align: center;
      }
      .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
        min-width: 0;
        max-width: 100%;
      }
      .title {
        font-weight: 650;
        font-size: 0.95rem;
        line-height: 1.22;
        letter-spacing: 0;
        min-width: 0;
        max-width: 100%;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .badge {
        margin: 2px 0;
        font-size: 0.7rem;
        padding: 4px 7px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.14);
        color: var(--muted);
        flex-shrink: 0;
      }
      .link-row.primary .badge {
        border-color: rgba(0,0,0,0.1);
        color: rgba(0,0,0,0.62);
      }
      .subtitle-small {
        margin-top: 4px;
        font-size: 0.86rem;
        color: var(--muted);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .link-row.primary .subtitle-small {
        color: rgba(0,0,0,0.66);
      }
      .chevron {
        justify-self: center;
        opacity: 0.5;
        font-size: 1rem;
        flex-shrink: 0;
      }

      .footer {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .footer button {
        margin-top: 10px;
        border: 0;
        background: transparent;
        color: var(--text);
        font-weight: 650;
        text-decoration: underline;
        cursor: pointer;
      }
      .privacy-status {
        margin-top: 10px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .privacy-banner {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        display: none;
        pointer-events: auto;
        padding: 16px;
        background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 94%, black 6%), color-mix(in srgb, var(--surface) 86%, transparent));
      }
      .privacy-banner h2 {
        margin: 0 0 8px;
        font-size: 1rem;
      }
      .privacy-banner p {
        margin: 0;
        color: var(--muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }
      .privacy-banner .privacy-note {
        margin-top: 10px;
        font-size: 0.8rem;
        color: var(--muted);
        opacity: 0.92;
      }
      .privacy-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .privacy-actions button {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 650;
        cursor: pointer;
        min-height: 40px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.14);
        pointer-events: auto;
      }
      .privacy-actions button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .privacy-accept {
        background: var(--primary-bg);
        color: var(--primary-text);
      }
      .privacy-analytics {
        background: var(--secondary-bg);
        color: var(--secondary-text);
      }
      .privacy-decline,
      .privacy-close {
        background: transparent;
        color: var(--text);
      }

      .status {
        padding: 32px 18px;
        text-align: center;
        color: var(--muted);
      }
      .status strong { color: var(--text); }

      @media (min-width: 740px) {
        .app { padding-top: 40px; }
        .hero { padding: 24px 24px; }
        .announcement { padding: 12px 14px; }
        .link-row { padding: 13px; }
        .privacy-banner { max-width: 720px; margin: 0 auto; left: 50%; right: auto; transform: translateX(-50%); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="shell">
        <a id="announcement" class="announcement card" href="#" hidden>
          <span id="announcementText"></span>
          <span class="arrow">→</span>
        </a>

        <section class="hero card">
          <div class="hero-top">
            <img id="avatar" class="avatar" alt="" />
            <div>
              <div class="eyebrow">Fan Lynks</div>
              <h1 id="title">Loading...</h1>
            </div>
          </div>
          <p id="subtitle" class="subtitle">Fetching your live page…</p>
          <a id="heroCta" class="hero-cta" href="#" hidden>Open</a>
        </section>

        <div id="content"></div>

        <footer class="footer">
          <div id="footerNote">Fast, clean, mobile-first landing page.</div>
          <button id="privacyChoices" type="button">Your Privacy Choices</button>
        </footer>
      </main>
    </div>

    <section id="privacyBanner" class="privacy-banner card" aria-live="polite">
      <h2 id="privacyTitle">Privacy choices</h2>
      <p id="privacyBody"></p>
      <div class="privacy-note">Essential functions stay on. Optional analytics and advertising choices can be changed later.</div>
      <div class="privacy-actions">
        <button id="privacyAccept" class="privacy-accept" type="button">Accept</button>
        <button id="privacyAnalyticsOnly" class="privacy-analytics" type="button">Analytics only</button>
        <button id="privacyDecline" class="privacy-decline" type="button">Essential only</button>
        <button id="privacyClose" class="privacy-close" type="button">Close</button>
      </div>
    </section>

    <script src="/app.js?v=20260925-brandmark1" defer></script>
  </body>
</html>
