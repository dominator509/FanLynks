<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d10" />
    <title>Custom Link Hub</title>
    <style>
      :root {
        --bg: #0d0f14;
        --bg-accent: radial-gradient(circle at top, rgba(255,255,255,0.06), transparent 30%);
        --surface: rgba(255,255,255,0.06);
        --surface-2: rgba(255,255,255,0.08);
        --text: #f7f7fb;
        --muted: #a9b0bf;
        --accent: #8b5cf6;
        --primary-bg: #ffffff;
        --primary-text: #12141a;
        --secondary-bg: rgba(255,255,255,0.08);
        --secondary-text: #f7f7fb;
        --neutral-bg: rgba(255,255,255,0.03);
        --neutral-text: #edf1f7;
        --border: rgba(255,255,255,0.12);
        --icon-bg: rgba(255,255,255,0.08);
        --shadow: 0 24px 64px rgba(0,0,0,0.28);
        --radius: 22px;
        --button-radius: 18px;
        --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-heading: var(--font-body);
        --max-width: 720px;
        --gap: 14px;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: var(--font-body);
        background: var(--bg-accent), var(--bg);
        color: var(--text);
      }

      .app {
        min-height: 100vh;
        padding: 20px 16px 56px;
      }

      .shell {
        width: 100%;
        max-width: var(--max-width);
        margin: 0 auto;
      }

      .card {
        background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 100%, white 0%), color-mix(in srgb, var(--surface) 78%, transparent));
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        border-radius: var(--radius);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      .announcement {
        display: none;
        text-decoration: none;
        color: var(--text);
        padding: 12px 16px;
        margin-bottom: 14px;
        font-size: 0.95rem;
        align-items: center;
        justify-content: space-between;
      }
      .announcement strong { font-weight: 700; }
      .announcement .arrow { opacity: 0.7; }

      .hero {
        padding: 24px 20px;
        margin-bottom: 18px;
      }
      .hero-top {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 12px;
      }
      .avatar {
        width: 66px;
        height: 66px;
        border-radius: 18px;
        object-fit: cover;
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--border);
        display: none;
      }
      .eyebrow {
        color: var(--accent);
        font-size: 0.8rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        margin-bottom: 6px;
      }
      h1 {
        margin: 0;
        font-family: var(--font-heading);
        font-size: clamp(1.9rem, 5vw, 2.7rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
      }
      .subtitle {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.55;
      }
      .hero-cta {
        display: inline-flex;
        margin-top: 16px;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-weight: 800;
        font-size: 1rem;
        padding: 15px 18px;
        border-radius: var(--button-radius);
        background: var(--primary-bg);
        color: var(--primary-text);
        box-shadow: 0 18px 36px rgba(0,0,0,0.22);
      }

      .section-label {
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 18px 4px 10px;
        font-weight: 800;
      }

      .links {
        display: grid;
        gap: var(--gap);
      }

      .link-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-decoration: none;
        color: inherit;
        padding: 14px;
        border-radius: var(--button-radius);
        border: 1px solid var(--border);
        background: var(--secondary-bg);
        transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
      }
      .link-row:hover {
        transform: translateY(-1px);
        border-color: rgba(255,255,255,0.24);
      }
      .link-row.primary {
        background: var(--primary-bg);
        color: var(--primary-text);
      }
      .link-row.neutral {
        background: var(--neutral-bg);
        color: var(--neutral-text);
      }

      .icon-slot {
        width: 52px;
        height: 52px;
        border-radius: 15px;
        background: var(--icon-bg);
        border: 1px solid rgba(255,255,255,0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
      }
      .link-row.primary .icon-slot {
        background: rgba(0,0,0,0.08);
        border-color: rgba(0,0,0,0.05);
      }
      .icon-slot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .icon-emoji {
        font-size: 1.3rem;
        line-height: 1;
      }

      .content {
        min-width: 0;
        flex: 1;
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .title {
        font-weight: 800;
        font-size: 1rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge {
        font-size: 0.72rem;
        padding: 5px 8px;
        border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.14);
        color: var(--muted);
        flex-shrink: 0;
      }
      .link-row.primary .badge {
        border-color: rgba(0,0,0,0.1);
        color: rgba(0,0,0,0.62);
      }
      .subtitle-small {
        margin-top: 4px;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.35;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .link-row.primary .subtitle-small {
        color: rgba(0,0,0,0.66);
      }
      .chevron {
        opacity: 0.5;
        font-size: 1.15rem;
      }

      .footer {
        margin-top: 18px;
        text-align: center;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .footer button {
        margin-top: 10px;
        border: 0;
        background: transparent;
        color: var(--text);
        font-weight: 700;
        text-decoration: underline;
        cursor: pointer;
      }
      .privacy-status {
        margin-top: 10px;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .privacy-banner {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        display: none;
        pointer-events: auto;
        padding: 18px;
        background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 94%, black 6%), color-mix(in srgb, var(--surface) 86%, transparent));
      }
      .privacy-banner h2 {
        margin: 0 0 8px;
        font-size: 1rem;
      }
      .privacy-banner p {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }
      .privacy-banner .privacy-note {
        margin-top: 10px;
        font-size: 0.8rem;
        color: var(--muted);
        opacity: 0.92;
      }
      .privacy-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .privacy-actions button {
        appearance: none;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 14px;
        font-weight: 800;
        cursor: pointer;
        min-height: 46px;
        box-shadow: 0 10px 24px rgba(0,0,0,0.14);
        pointer-events: auto;
      }
      .privacy-actions button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .privacy-accept {
        background: var(--primary-bg);
        color: var(--primary-text);
      }
      .privacy-analytics {
        background: var(--secondary-bg);
        color: var(--secondary-text);
      }
      .privacy-decline,
      .privacy-close {
        background: transparent;
        color: var(--text);
      }

      .status {
        padding: 32px 18px;
        text-align: center;
        color: var(--muted);
      }
      .status strong { color: var(--text); }

      @media (min-width: 740px) {
        .app { padding-top: 40px; }
        .hero { padding: 30px 28px; }
        .announcement { padding: 14px 18px; }
        .link-row { padding: 16px; }
        .privacy-banner { max-width: 720px; margin: 0 auto; left: 50%; right: auto; transform: translateX(-50%); }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="shell">
        <a id="announcement" class="announcement card" href="#" hidden>
          <span id="announcementText"></span>
          <span class="arrow">→</span>
        </a>

        <section class="hero card">
          <div class="hero-top">
            <img id="avatar" class="avatar" alt="" />
            <div>
              <div class="eyebrow">Custom Link Hub</div>
              <h1 id="title">Loading...</h1>
            </div>
          </div>
          <p id="subtitle" class="subtitle">Fetching your live page…</p>
          <a id="heroCta" class="hero-cta" href="#" hidden>Open</a>
        </section>

        <div id="content"></div>

        <footer class="footer">
          <div id="footerNote">Fast, clean, mobile-first landing page.</div>
          <button id="privacyChoices" type="button">Your Privacy Choices</button>
        </footer>
      </main>
    </div>

    <section id="privacyBanner" class="privacy-banner card" aria-live="polite">
      <h2 id="privacyTitle">Privacy choices</h2>
      <p id="privacyBody"></p>
      <div class="privacy-note">Essential functions stay on. Optional analytics and advertising choices can be changed later.</div>
      <div class="privacy-actions">
        <button id="privacyAccept" class="privacy-accept" type="button">Accept</button>
        <button id="privacyAnalyticsOnly" class="privacy-analytics" type="button">Analytics only</button>
        <button id="privacyDecline" class="privacy-decline" type="button">Essential only</button>
        <button id="privacyClose" class="privacy-close" type="button">Close</button>
      </div>
    </section>

    <script src="/app.js" defer></script>
  </body>
</html>
